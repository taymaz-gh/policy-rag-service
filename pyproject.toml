
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-platform"
version = "0.1.0"
description = "An agentic RAG platform with LangChain, LangGraph, PostHog, and Datadog."
requires-python = ">=3.12,<3.13"

dependencies = [
    "langchain-pymupdf4llm>=0.2,<1",
    "langchain-text-splitters>=1.0,<2.0",
    "reportlab>=4,<5",
    "langchain-huggingface>=1.0,<2.0",
    "sentence-transformers>=5.0,<6.0",
    "langchain-chroma>=1.0,<2.0",
    "langchain-google-genai>=4.0,<5.0",
    "python-dotenv>=1.0,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
